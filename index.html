      const r = ui.quebra, q = r.ok ? "" : itemsHTML(QUEBRA[h.id] || []);
      top = `<div class="note mark"><div class="label">${r.ok ? "Intervalo cumprido" : "Registrado"}</div>
        <p>${uu(r.dias)}${r.dias ? ` (${br(r.ini)} a ${br(r.fim)})` : ""} ficaram no histórico. ${r.min ? `O mínimo do nível era ${r.min} ${r.min === 1 ? "dia" : "dias"}: ${r.ok ? "cumprido" : "ficou abaixo"}.` : "No nível Evitar, qualquer vez encerra a sequência."} A contagem recomeça amanhã.</p>
        ${r.ok ? "" : `<div class="label">Para a próxima vez</div>${q ? q : `<p class="empty">Ainda sem pesquisa sobre recaída para este hábito.</p>`}`}
        <div class="row-btns"><button class="btn quiet" data-act="fechar">Ok</button></div></div>`;
    } else if (ui.quebra && ui.quebra.id === h.id) {
      // Primeiro o que é específico do hábito, depois o que vale para qualquer hábito.
      const q = itemsHTML([...(QUEBRA[h.id] || []), ...(QUEBRA.geral || [])]);
      top = `<div class="note mark"><div class="label">Sequência guardada</div>
        <p>${uu(ui.quebra.dias)} (${br(ui.quebra.ini)} a ${br(ui.quebra.fim)}) ficaram no histórico. Recorde: ${uu(rec)}.</p>
        <div class="label">Para a próxima vez</div>
        ${q ? q : `<p class="empty">Ainda sem pesquisa sobre recaída para este hábito.</p>`}
        <div class="row-btns"><button class="btn primary" data-act="comecar">${semanal(h) ? "Recomeçar na segunda, " + br(fromDay(segunda(toDay(today())) + 7)) : "Recomeçar hoje"}</button><button class="btn quiet" data-act="fechar">Depois</button></div></div>`;
    } else if (cicloAcabou(h.id) && !st.solto) {
      // Revisão de fim de ciclo: o resultado e quatro saídas. Nada muda sem uma escolha.
      const c = st.ciclo, m = medir(h, c, fimCiclo(c));
      top = `<div class="note mark"><div class="label">Fim do ciclo de ${c.sem} semanas · ${br(c.ini)} a ${br(fromDay(fimCiclo(c)))}</div>
        <p>${m.pct === 100 ? "Meta cumprida" : "Meta atingida em " + m.pct + "%"}: ${medidaTxt(h, m)}${vezesTxt(h, m)}.</p>
        <p class="small">Manter, subir de degrau, descer para o piso ou soltar a contagem. O próximo ciclo começa no dia seguinte ao fim deste.</p>
        <div class="row-btns"><button class="btn primary" data-act="rev-manter">Manter</button>${h.niveis && st.nivel < h.niveis.length - 1 ? `<button class="btn quiet" data-act="rev-subir">Subir: ${h.niveis[st.nivel + 1].nome}</button>` : ""}${h.niveis && st.nivel > 0 ? `<button class="btn quiet" data-act="rev-piso">Piso: ${h.niveis[st.nivel - 1].nome}</button>` : ""}<button class="btn quiet" data-act="rev-soltar">Soltar</button></div></div>`;
    } else if (n > 0 && i > st.visto && !st.solto) {
      top = `<div class="note mark"><div class="label">Marco alcançado · ${U(h)[0]} ${f.a}</div>
        <p>${f.t}.</p>
        ${f.it.length ? itemsHTML(f.it.slice(0, 1)) : ""}
        <p class="empty">Não há pesquisa sobre os marcos em si; o texto acima é o primeiro item desta faixa.</p>
        <div class="row-btns"><button class="btn quiet" data-act="visto">Ok</button></div></div>`;
    }

    const c0 = st.ciclo && !cicloAcabou(h.id) ? st.ciclo : null, mc = c0 ? medir(h, c0, toDay(today())) : null;
    const semC = c0 ? Math.min(c0.sem, Math.floor((toDay(today()) - toDay(c0.ini)) / 7) + 1) : 0;
    const linhaCiclo = c0 && toDay(c0.ini) <= toDay(today()) ? `<p class="small">Ciclo: semana ${semC} de ${c0.sem} · ${mc.pct}% até agora</p>` : "";
    const head = st.solto
      ? `<div class="count"><span class="big">—</span><span class="unit">anda sozinho desde ${br(st.solto)}</span></div>
         <p class="small">A contagem foi solta numa revisão de ciclo. O histórico continua guardado.</p>
         <div class="row-btns"><button class="btn quiet" data-act="voltar">Voltar a contar</button></div>`
      : (n > 0
      ? `<div class="count"><span class="big">${n}</span><span class="unit">${U(h)[n === 1 ? 0 : 1]} · desde ${br(st.ini)}</span></div>
         <div class="band"><div class="small">Faixa ${semanal(h) ? "das semanas" : "dos dias"} ${rangeLabel(f)}</div><div class="t">${f.t}</div>
         ${nx ? `<div class="small">Próxima em ${uu(nx.a - n)}: ${nx.t}</div>` : ""}</div>`
      : agendado(h.id)
      ? `<div class="count"><span class="big">0</span><span class="unit">${intervalo(h) ? "última vez hoje · a contagem começa amanhã" : "recomeça na segunda, " + br(st.ini)}</span></div>`
      : `<div class="count"><span class="big">0</span><span class="unit">sem sequência em curso</span></div>
         ${ui.quebra ? "" : `<div class="row-btns"><button class="btn primary" data-act="comecar">${semanal(h) ? "Começar nesta semana" : intervalo(h) ? "Começar a contar hoje" : "Começar hoje"}</button></div>`}`) + linhaCiclo;

    // Seção do ciclo: em curso (com a medida até agora) ou formulário para começar um.
    const revs = st.chist.length ? `<ul class="hist">${st.chist.slice().reverse().map(x => `<li><span>${br(x.ini)} a ${br(x.fim)} · ${x.decisao}</span><span class="d">${x.pct}%</span></li>`).join("")}</ul>` : "";
    const ciclo = st.solto ? "" : `<details${ui.ciclo ? " open" : ""}><summary>Ciclo${c0 ? ` · semana ${semC} de ${c0.sem}` : ""}</summary><div class="inside">
        ${c0 ? `<p>${c0.sem} semanas, de ${br(c0.ini)} a ${br(fromDay(fimCiclo(c0)))}.</p>
          <p class="small">Até agora: ${mc.pct}% · ${medidaTxt(h, mc)}${vezesTxt(h, mc)}. A página presume que os dias sem registro foram cumpridos.</p>
          <div class="row-btns"><button class="btn quiet" data-act="ciclo-cancelar">Cancelar ciclo</button></div>`
        : st.ciclo ? `<p class="small">O ciclo terminou; a revisão está no topo da página.</p>`
        : `<p class="small">Sem ciclo em curso. Os ciclos têm 7 semanas; escolha a data de início (pode ser no passado).${semanal(h) ? " Em hábitos semanais, o ciclo começa na segunda-feira da semana escolhida." : ""}</p>
          <div class="row-btns">
          <input id="cini" type="date" value="${today()}" max="${today()}" aria-label="Início do ciclo">
          <button class="btn quiet" data-act="ciclo-comecar">Começar ciclo</button></div>`}
        ${revs ? `<div class="label">Revisões</div>${revs}` : ""}
      </div></details>`;

    const items = itemsHTML(f.it);
    const rows = h.faixas.map((x, k) => `<div class="${n > 0 && k === i ? "cur" : ""}"><span class="r">${rangeLabel(x)}</span><span>${x.t}</span></div>`).join("");
    const hist = st.hist.length
      ? `<ul class="hist">${st.hist.slice().reverse().map(x => `<li><span>${x.dias ? br(x.ini) + " a " + br(x.fim) : "vez em " + br(x.vez)}</span><span class="d">${x.dias}${semanal(h) ? " sem" : ""}${intervalo(h) ? (x.ok ? " · ok" : " · quebra") : ""}</span></li>`).join("")}</ul>`
      : `<p class="empty">Nenhuma sequência encerrada ainda.</p>`;

    // Intervalo: o botão é "Aconteceu hoje" e fica disponível sempre que a contagem foi iniciada (inclusive no dia de uma vez anterior).
    const zerar = st.solto ? "" : intervalo(h) ? (st.ini ? (ui.confirmar
      ? `<div class="note"><p>Aconteceu hoje? ${n > 1 ? `Os ${uu(n - 1)} até ontem ficam` : "A vez fica"} no histórico, e a contagem recomeça amanhã.</p>
         <div class="row-btns"><button class="btn danger" data-act="zerar">Registrar</button><button class="btn quiet" data-act="cancelar">Cancelar</button></div></div>`
      : `<div class="row-btns"><button class="btn quiet" data-act="pedir">Aconteceu hoje</button></div>`) : "")
      : n > 0 ? (ui.confirmar
      ? `<div class="note"><p>${semanal(h) ? `Esta semana não deu? As ${uu(n)} ficam guardadas no histórico.` : `Zerar ${uu(n)}? A sequência fica guardada no histórico.`}</p>
         <div class="row-btns"><button class="btn danger" data-act="zerar">${semanal(h) ? "Encerrar" : "Zerar"}</button><button class="btn quiet" data-act="cancelar">Cancelar</button></div></div>`
      : `<div class="row-btns"><button class="btn quiet" data-act="pedir">${semanal(h) ? "Esta semana não deu" : "Zerar sequência"}</button></div>`) : "";

    // Níveis: degraus do mesmo hábito. Mudar de nível não zera a sequência; a mudança fica registrada.
    const nv = h.niveis ? h.niveis.map((x, k) => `<div class="${k === st.nivel ? "cur" : ""}"><span class="r">${k + 1}</span><span>${x.nome}</span></div>`).join("") : "";
    const nivel = h.niveis ? `<details><summary>Nível · ${h.niveis[st.nivel].nome}</summary><div class="inside">
        <div class="all">${nv}</div>
        <p class="small">Mudar de nível não zera a sequência; a mudança fica no histórico.</p>
        <div class="row-btns">${st.nivel < h.niveis.length - 1 ? `<button class="btn quiet" data-act="subir">Subir para ${h.niveis[st.nivel + 1].nome}</button>` : ""}${st.nivel > 0 ? `<button class="btn quiet" data-act="descer">Voltar para ${h.niveis[st.nivel - 1].nome}</button>` : ""}</div>
        ${st.nhist.length ? `<ul class="hist">${st.nhist.slice().reverse().map(x => `<li><span>${br(x.data)}</span><span>${h.niveis[x.nivel].nome}</span></li>`).join("")}</ul>` : ""}
      </div></details>` : "";

    return `<a class="back" href="#/c/${c.id}">‹ ${c.nome}</a>
      <header><h1>${h.nome}</h1><p class="small">${intervalo(h) ? "Conta os " + h.crit.charAt(0).toLowerCase() + h.crit.slice(1) : `Conta como ${U(h)[0]}: ${h.crit.charAt(0).toLowerCase() + h.crit.slice(1)}`}${h.niveis ? ` · nível: ${h.niveis[st.nivel].nome}` : ""}</p></header>
      ${top}
      ${head}
      <div>
      ${n > 0 && !st.solto ? `<details><summary>O que costuma acontecer agora</summary><div class="inside">${items}<p class="small">${h.obs}</p></div></details>` : ""}
      ${ciclo}
      ${nivel}
      <details><summary>Todas as faixas</summary><div class="inside"><div class="all">${rows}</div></div></details>
      <details${ui.copia ? " open" : ""}><summary>Histórico · recorde ${rec}</summary><div class="inside">${hist}
        <div class="row-btns"><button class="btn quiet" data-act="copiar">Copiar histórico</button></div>
        ${ui.copia ? `<p class="small">${ui.copia.msg}</p>${ui.copia.txt ? `<textarea readonly>${ui.copia.txt}</textarea>` : ""}` : ""}
      </div></details>
      <details><summary>Corrigir contagem</summary><div class="inside">
        <p class="small">Para ajustar o número de ${U(h)[1]} sem registrar quebra (por exemplo, se esqueceu de abrir a página quando começou).</p>
        <div class="stepper"><button data-act="dec" aria-label="Menos um">−</button><input id="n" type="number" inputmode="numeric" min="0" value="${n}" aria-label="Contagem da sequência"><button data-act="inc" aria-label="Mais um">+</button></div>
      </div></details>
      </div>
      ${zerar}`;
  }

  function render() {
    const r = location.hash.replace(/^#\/?/, "").split("/");
    let html;
    if (r[0] === "c" && CATS.find(c => c.id === r[1])) html = cat(CATS.find(c => c.id === r[1]));
    else if (r[0] === "h" && byId[r[1]]) html = habit(byId[r[1]]);
    else html = home();
    // Na mesma tela, as seções abertas continuam abertas depois de redesenhar (ex.: + e − em "Corrigir contagem").
    const chave = d => d.querySelector("summary").textContent.split(" · ")[0];
    const abertas = location.hash === lastHash ? [...app.querySelectorAll("details[open]")].map(chave) : [];
    lastHash = location.hash;
    app.innerHTML = html;
    app.querySelectorAll("details").forEach(d => { if (abertas.includes(chave(d))) d.open = true; });
  }
  let lastHash = null;

  function exportText() {
    const lines = ["Marcos por dia — histórico em " + br(today()), ""];
    HABITS.forEach(h => {
      const st = S.h[h.id];
      lines.push(h.nome + ": " + un(h, count(h.id)) + (st.ini ? " (desde " + br(st.ini) + ")" : "") + "; recorde " + best(h.id) + (h.niveis ? "; nível " + h.niveis[st.nivel].nome : ""));
      st.hist.forEach(x => lines.push("  " + (x.dias ? br(x.ini) + " a " + br(x.fim) : "vez em " + br(x.vez)) + ": " + un(h, x.dias) + (intervalo(h) ? (x.ok ? " (ok)" : " (quebra)") : "")));
      st.nhist.forEach(x => lines.push("  nível em " + br(x.data) + ": " + h.niveis[x.nivel].nome));
      if (st.ciclo) lines.push("  ciclo em curso: " + st.ciclo.sem + " semanas desde " + br(st.ciclo.ini));
      st.chist.forEach(x => lines.push("  ciclo " + br(x.ini) + " a " + br(x.fim) + ": " + x.pct + "%, " + x.decisao));
      if (st.solto) lines.push("  solto desde " + br(st.solto));
    });
    lines.push("", "Dados brutos:", JSON.stringify(S));
    return lines.join("\n");
  }

  app.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-act]");
    if (!b) return;
    const id = (location.hash.match(/^#\/h\/(\w+)/) || [])[1];
    if (!id) return;
    const st = S.h[id], act = b.dataset.act;
    if (act === "pedir") ui.confirmar = true;
    else if (act === "cancelar") ui.confirmar = false;
    else if (act === "zerar") {
      const n = count(id), h = byId[id];
      if (intervalo(h)) {
        // A vez de hoje fecha o intervalo: os dias sem vão do início até ontem. A contagem segue sozinha a partir de amanhã.
        const dias = Math.max(0, n - 1), min = minimo(h);
        const reg = { ini: st.ini, fim: fromDay(toDay(today()) - 1), dias, vez: today(), nivel: st.nivel, min, ok: min !== null && dias >= min };
        st.hist.push(reg);
        st.ini = fromDay(toDay(today()) + 1); st.visto = -1; save();
        ui = { confirmar: false, quebra: Object.assign({ id }, reg), copia: null };
        render(); return;
      }
      // Semanal: a semana em curso não deu, então a sequência guardada termina no domingo anterior.
      const reg = semanal(h)
        ? { ini: st.ini, fim: fromDay(segunda(toDay(today())) - 1), dias: n - 1 }
        : { ini: st.ini, fim: today(), dias: n };
      if (reg.dias > 0) st.hist.push(reg);
      st.ini = null; st.visto = -1; save();
      ui = { confirmar: false, quebra: Object.assign({ id }, reg), copia: null };
    }
    else if (act === "comecar") {
      const h = byId[id];
      // Semanal: a primeira vez começa nesta semana; depois de uma semana que não deu, na próxima segunda.
      st.ini = semanal(h) ? fromDay(segunda(toDay(today())) + (ui.quebra ? 7 : 0)) : today();
      st.visto = 0; save(); ui.quebra = null;
    }
    else if (act === "subir" || act === "descer") {
      const h = byId[id], k = st.nivel + (act === "subir" ? 1 : -1);
      if (h.niveis && k >= 0 && k < h.niveis.length) { st.nivel = k; st.nhist.push({ data: today(), nivel: k }); save(); }
    }
    else if (act.startsWith("rev-")) {
      const h = byId[id], c = st.ciclo, fim = fimCiclo(c), m = medir(h, c, fim);
      const k = act === "rev-subir" ? st.nivel + 1 : act === "rev-piso" ? st.nivel - 1 : st.nivel;
      const decisao = { "rev-manter": "manteve", "rev-subir": "subiu", "rev-piso": "piso", "rev-soltar": "soltou" }[act];
      st.chist.push({ ini: c.ini, fim: fromDay(fim), sem: c.sem, pct: m.pct, feitos: m.feitos, total: m.total, vezes: m.vezes, vezesOk: m.vezesOk, nivel: st.nivel, decisao });
      if (h.niveis && k !== st.nivel && k >= 0 && k < h.niveis.length) { st.nivel = k; st.nhist.push({ data: today(), nivel: k }); }
      if (act === "rev-soltar") { st.solto = today(); st.ciclo = null; }
      else st.ciclo = { ini: fromDay(fim + 1), sem: c.sem };
      save();
    }
    else if (act === "ciclo-comecar") {
      const h = byId[id], sem = SEMANAS_CICLO;
      let ini = document.getElementById("cini").value || today();
      if (toDay(ini) > toDay(today())) ini = today();
      if (semanal(h)) ini = fromDay(segunda(toDay(ini)));
      st.ciclo = { ini, sem }; ui.ciclo = true; save();
    }
    else if (act === "ciclo-cancelar") { st.ciclo = null; ui.ciclo = true; save(); }
    else if (act === "voltar") { st.solto = null; save(); }
    else if (act === "fechar") ui.quebra = null;
    else if (act === "visto") { st.visto = idxFor(byId[id], count(id)); save(); }
    else if (act === "inc" || act === "dec") setCount(id, count(id) + (act === "inc" ? 1 : -1));
    else if (act === "copiar") {
      const txt = exportText();
      const done = ok => { ui.copia = ok ? { msg: "Copiado. Cole num lugar seguro (uma nota, um e-mail para si mesmo)." } : { msg: "Não foi possível copiar sozinho. Selecione o texto abaixo e copie.", txt }; render(); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); else done(false);
      return;
    }
    render();
    const again = document.querySelector(`button[data-act="${act}"]`);
    if (again) again.focus();
  });
  app.addEventListener("change", ev => {
    if (ev.target.id !== "n") return;
    const id = (location.hash.match(/^#\/h\/(\w+)/) || [])[1];
    if (id) { setCount(id, ev.target.value); render(); }
  });
  app.addEventListener("toggle", ev => { if (ev.target.tagName === "DETAILS" && !ev.target.open && ui.copia) ui.copia = null; }, true);
  window.addEventListener("hashchange", () => { ui = { confirmar: false, quebra: null, copia: null, ciclo: false }; render(); window.scrollTo(0, 0); });
  // Ao voltar para a aba num outro dia, a contagem avança sozinha.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  render();
})();
</script>
</body>
</html>
